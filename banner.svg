<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f12"/>
      <stop offset="0.6" stop-color="#14361f"/>
      <stop offset="1" stop-color="#1f4a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.45" r="0.42">
      <stop offset="0" stop-color="#f2d16b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f2d16b" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t1 { fill: #eef8ea; font-size: 38px; font-weight: 700; }
      .t2 { fill: #f2d16b; font-size: 19px; font-weight: 500; }
      .t3 { fill: #9fc4a4; font-size: 14px; letter-spacing: 1.5px; }
      .tag { fill: #0b1f12; font-size: 13px; font-weight: 700; }
      .ax { fill: #9fc4a4; font-size: 12px; }
      .leaf { transform-origin: 1090px 250px; animation: sway 5s ease-in-out infinite; }
      @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
      .ring { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.8; } }
      .drop { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 3.5s ease-out forwards infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 400; } 60%,100% { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- tree rings, faint, left background -->
  <g fill="none" stroke="#9fc4a4" opacity="0.08">
    <circle cx="80" cy="300" r="60"/><circle cx="80" cy="300" r="100"/><circle cx="80" cy="300" r="140"/><circle cx="80" cy="300" r="185"/><circle cx="80" cy="300" r="230"/>
  </g>

  <text x="48" y="92" class="t3">PLANT MERISTEM LONGEVITY · GINKGO CAMBIUM</text>
  <text x="48" y="140" class="t1">Plant Meristem Longevity</text>
  <text x="48" y="176" class="t2">How do 600-year-old Ginkgo trees keep their stem cells working?</text>
  <g transform="translate(48,206)">
    <rect width="190" height="30" rx="15" fill="#f2d16b"/>
    <text x="95" y="20" text-anchor="middle" class="tag">20 · 200 · 600-year trees</text>
    <rect x="202" width="156" height="30" rx="15" fill="#9fe0a8"/>
    <text x="280" y="20" text-anchor="middle" class="tag">601 miRNAs tested</text>
    <rect x="370" width="210" height="30" rx="15" fill="#f4a582"/>
    <text x="475" y="20" text-anchor="middle" class="tag">miR397 ↓ 77× (FDR 0.01)</text>
  </g>

  <!-- mini chart: miR397 across ages -->
  <g transform="translate(660,62)">
    <rect width="320" height="180" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#9fc4a4" stroke-opacity="0.3"/>
    <line x1="40" y1="145" x2="300" y2="145" stroke="#9fc4a4"/>
    <line x1="40" y1="25" x2="40" y2="145" stroke="#9fc4a4"/>
    <polyline class="drop" points="70,40 170,95 270,128" fill="none" stroke="#f4a582" stroke-width="3"/>
    <circle cx="70" cy="40" r="6" fill="#f4a582"/><circle cx="170" cy="95" r="6" fill="#f4a582"/><circle cx="270" cy="128" r="6" fill="#f4a582"/>
    <text x="70" y="165" text-anchor="middle" class="ax">20 y</text>
    <text x="170" y="165" text-anchor="middle" class="ax">200 y</text>
    <text x="270" y="165" text-anchor="middle" class="ax">600 y</text>
    <text x="300" y="20" text-anchor="end" class="ax" style="fill:#f4a582">miR397 in cambium</text>
  </g>

  <!-- ginkgo leaf -->
  <g class="leaf">
    <path d="M1090,250 L1090,170" stroke="#c9a94a" stroke-width="4" stroke-linecap="round"/>
    <path d="M1090,175 C1040,160 1010,110 1020,70 C1050,85 1075,80 1090,62 C1105,80 1130,85 1160,70 C1170,110 1140,160 1090,175 Z" fill="#f2d16b" opacity="0.92"/>
    <path d="M1090,172 L1090,70" stroke="#c9a94a" stroke-width="2" opacity="0.6"/>
    <path d="M1090,172 C1075,140 1055,110 1040,85 M1090,172 C1105,140 1125,110 1140,85" stroke="#c9a94a" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>
  <circle class="ring" cx="1090" cy="120" r="78" fill="none" stroke="#f2d16b" stroke-opacity="0.25"/>
</svg>
